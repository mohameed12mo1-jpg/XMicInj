name: Build XMicInject for Liqaa

on:
  push:
    branches: [ liqaa-build-release ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Liqaa build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone upstream XMicInject source
        run: git clone --depth 1 https://github.com/n00b-labs/XMicInject.git upstream

      - name: Apply Liqaa module identity
        run: python3 tools/prepare_liqaa.py upstream

      - name: Apply Liqaa-only AudioRecord hook
        run: cp patches/XMicHook.kt upstream/app/src/main/java/com/xmicinject/XMicHook.kt

      - name: Apply direct V6 transport
        run: cp patches/IpcClient.kt upstream/app/src/main/java/com/xmicinject/IpcClient.kt

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify and stage APK
        run: |
          test -s upstream/app/build/outputs/apk/debug/app-debug.apk
          cp upstream/app/build/outputs/apk/debug/app-debug.apk XMicInject-Liqaa-debug.apk
          sha256sum XMicInject-Liqaa-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XMicInject-Liqaa-debug
          path: XMicInject-Liqaa-debug.apk
          if-no-files-found: error
          retention-days: 14
