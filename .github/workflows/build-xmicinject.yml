name: Build XMicInject APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone upstream XMicInject
        run: git clone --depth 1 https://github.com/n00b-labs/XMicInject.git upstream

      - name: Apply Android-side direct V4 transport patch
        run: cp patches/IpcClient.kt upstream/app/src/main/java/com/xmicinject/IpcClient.kt

      - name: Apply Wevo native AudioRecord hook patch
        run: cp patches/XMicHook.kt upstream/app/src/main/java/com/xmicinject/XMicHook.kt

      - name: Make Gradle wrapper executable
        run: chmod +x upstream/gradlew

      - name: Build debug APK
        working-directory: upstream
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp upstream/app/build/outputs/apk/debug/app-debug.apk XMicInject-Direct-NativeRead-OneWay-V4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XMicInject-Direct-NativeRead-OneWay-V4-APK
          path: XMicInject-Direct-NativeRead-OneWay-V4.apk
          if-no-files-found: error
